name: Deploy do portfólio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    name: Empacotar site
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v6
      - name: Preparar arquivos públicos
        run: |
          test -f index.html
          mkdir _site
          cp -- ./*.html ./*.css _site/
          cp -R -- imagens _site/
      - name: Enviar arquivos estáticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Publicar site
        id: pages
        uses: actions/deploy-pages@v5
